name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The opt-in live test (test/live.test.ts) is skipped automatically when
      # SYNTHETIC_API_KEY is not set, so CI runs unit + fuzz tests only.
      - run: npm test

  # Verify the published artifact: pack the tarball, install it elsewhere, and
  # confirm the bin starts. Guards the publish contract (files array, bin path,
  # shebang, prepare) that the build/test jobs do not exercise.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pack and smoke-test the published bin
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$tarball" >/dev/null
          installed="node_modules/@baanish/synthetic-search-mcp/dist/index.js"
          test -f "$installed"
          head -n1 "$installed" | grep -q '^#!/usr/bin/env node'
          bin="node_modules/.bin/synthetic-search-mcp"
          test -x "$bin"
          # Drive a real MCP initialize over stdio and assert the server replies.
          # timeout bounds the run since the server stays up after responding.
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          out="$(printf '%s\n' "$init" | timeout 10 "$bin" 2>/dev/null || true)"
          echo "$out" | grep -q 'serverInfo'
